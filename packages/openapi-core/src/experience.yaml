openapi: 3.1.0
info:
  title: Loadline — Experience
  version: 0.1.0
  description: Cohort definitions and realised claims, lapse, and persistency experience.
  license:
    name: Proprietary
  x-domain: exp
  x-product-slug: ai-ins-loadline
servers:
- url: https://api.loadline.local
  description: Local API
- url: /
  description: Relative
security:
- apiKey: []
tags:
- name: Experience
  description: Cohort definitions and realised claims, lapse, and persistency
paths:
  /v1/experience/cohorts:
    get:
      operationId: listCohortDefinitions
      tags:
      - Experience
      security:
      - bearerAuth: []
      parameters:
      - name: cursor
        in: query
        schema:
          type: string
      - name: limit
        in: query
        schema:
          type: integer
          minimum: 1
          maximum: 200
          default: 50
      - name: programmeId
        in: query
        schema:
          type: string
      responses:
        '200':
          description: Engaged and matched unengaged cohort definitions
          content:
            application/json:
              schema:
                $ref: ./experience.schemas.yaml#/components/schemas/ListEnvelopeCohortDefinition
        default:
          $ref: ./common/responses.yaml#/components/responses/Problem
      x-repository: CohortDefinition
      summary: List Cohort Definitions
    post:
      operationId: defineCohort
      tags:
      - Experience
      security:
      - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: ./experience.schemas.yaml#/components/schemas/CohortDefinitionCreate
      responses:
        '201':
          description: Cohort defined with its selection-effect separation method
          content:
            application/json:
              schema:
                $ref: ./experience.schemas.yaml#/components/schemas/DataEnvelopeCohortDefinition
        '422':
          description: Rejected when an engaged cohort has no comparable unengaged cohort or no stated
            method for separating self-selection from behaviour.
          content:
            application/json:
              schema:
                $ref: ./common/problem.yaml#/components/schemas/Problem
        default:
          $ref: ./common/responses.yaml#/components/responses/Problem
      x-repository: CohortDefinition
      summary: Define Cohort
  /v1/experience/observations:
    get:
      operationId: listExperienceObservations
      tags:
      - Experience
      security:
      - bearerAuth: []
      parameters:
      - name: cursor
        in: query
        schema:
          type: string
      - name: limit
        in: query
        schema:
          type: integer
          minimum: 1
          maximum: 200
          default: 50
      - name: cohortId
        in: query
        schema:
          type: string
      - name: period
        in: query
        schema:
          type: string
      responses:
        '200':
          description: Realised claims, lapse, and persistency for the cohort against the priced assumption.
          content:
            application/json:
              schema:
                $ref: ./experience.schemas.yaml#/components/schemas/ListEnvelopeExperienceObservation
        default:
          $ref: ./common/responses.yaml#/components/responses/Problem
      x-repository: ExperienceObservation
      summary: List Experience Observations
  /v1/experience/savings-credits:
    post:
      operationId: creditExpectedClaimsSaving
      tags:
      - Experience
      security:
      - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: ./experience.schemas.yaml#/components/schemas/SavingsCreditCreate
      responses:
        '201':
          description: Expected-claims saving credited to the pricing basis after actuarial sign-off on
            observed cohort experience.
          content:
            application/json:
              schema:
                $ref: ./experience.schemas.yaml#/components/schemas/DataEnvelopeSavingsCredit
        '409':
          description: Refused because the observation window is incomplete, the selection effect is unseparated,
            or persistency deteriorated materially.
          content:
            application/json:
              schema:
                $ref: ./common/problem.yaml#/components/schemas/Problem
        default:
          $ref: ./common/responses.yaml#/components/responses/Problem
      x-repository: SavingsCredit
      summary: Credit Expected Claims Saving
components:
  securitySchemes:
    apiKey:
      $ref: ./common/security.yaml#/components/securitySchemes/apiKey
    bearerAuth:
      $ref: ./common/security.yaml#/components/securitySchemes/bearerAuth
  parameters:
    Cursor:
      name: cursor
      in: query
      schema:
        type: string
    Limit:
      name: limit
      in: query
      schema:
        type: integer
        minimum: 1
        maximum: 200
        default: 50
