apis:
  identity:
    root: src/identity.yaml
  scoring:
    root: src/scoring.yaml
  composition:
    root: src/composition.yaml
  permitting:
    root: src/permitting.yaml
  engagement:
    root: src/engagement.yaml
  experience:
    root: src/experience.yaml
  claims:
    root: src/claims.yaml
  reinsurance:
    root: src/reinsurance.yaml

extends:
  - recommended

rules:
  no-unused-components: off
  operation-4xx-response: warn
  operation-summary: warn
  info-license: off
  info-license-url: off
  info-license-strict: off
  tag-description: off
  operation-operationId: error
  no-invalid-media-type-examples: off
  security-defined: warn
  no-unresolved-refs: error

theme:
  openapi:
    generateCodeSamples:
      languages: []
