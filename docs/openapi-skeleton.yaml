openapi: 3.0.3
info:
  title: Loadline
  version: 0.1.0
  description: >-
    Premium-composition platform for life and health risk. Every production model
    declares the term of the price it acts on — expected claims, loading for risk,
    or loading for expense — every rating factor carries a per-jurisdiction
    permitted-use position, and no offer may leave the permitted variation
    envelope. Engagement touchpoints and realised cohort experience decide whether
    an expected-claims saving may be credited to price.
  x-product-slug: ai-ins-loadline
  x-source: ai-in-insurance/h2o_ai-session2-h2oaiworldlondon2018-madsenv2-181102025107/
servers:
  - url: https://api.example.com
tags:
  - name: Scoring
    description: Consent resolution, risk scoring, and score contributions
  - name: Composition
    description: Premium composition, commercial calibration, and variation gate
  - name: Permitting
    description: Factor permits per jurisdiction and model validation queue
  - name: Engagement
    description: Programmes, enrolment, and the touchpoint ledger
  - name: Experience
    description: Cohort definitions and realised claims, lapse, and persistency
  - name: Claims
    description: Automatic settlement, fraud referral, and expense measurement
  - name: Reinsurance
    description: Cession and cohort experience against the treaty pricing basis
paths:
  /v1/risk-subjects/{riskSubjectId}/consent:
    parameters:
      - $ref: "#/components/parameters/RiskSubjectId"
    get:
      operationId: resolveConsentState
      tags: [Scoring]
      security:
        - ApiKeyAuth: []
        - BearerAuth: []
      parameters:
        - name: purpose
          in: query
          schema:
            $ref: "#/components/schemas/ProcessingPurpose"
      responses:
        "200":
          description: Which data sources may feed which decision, at point of use
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DataEnvelopeConsentState"
        "401":
          $ref: "#/components/responses/Unauthorized"
    post:
      operationId: recordConsentChange
      tags: [Scoring]
      security:
        - ApiKeyAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ConsentRecordCreate"
      responses:
        "201":
          description: >-
            Consent granted or withdrawn. A withdrawal triggers the defined
            pricing and servicing fallback rather than a service failure.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DataEnvelopeConsentRecord"
  /v1/scores:
    post:
      operationId: scoreRiskSubject
      tags: [Scoring]
      security:
        - ApiKeyAuth: []
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ScoreRequest"
      responses:
        "200":
          description: Score contributions, each attributed to one premium term
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DataEnvelopeScoreResult"
        "409":
          description: >-
            Scoring refused. Raised when a required feature has no permitted-use
            position for the jurisdiction, when consent is absent for the purpose,
            or when restricted health data such as genetic results is in scope.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Problem"
  /v1/scores/{scoreId}/explanation:
    parameters:
      - $ref: "#/components/parameters/ScoreId"
    get:
      operationId: getScoreExplanation
      tags: [Scoring]
      security:
        - BearerAuth: []
      responses:
        "200":
          description: >-
            Factor-level explanation mapped to the rating basis, suitable for an
            underwriter and for disclosure to the applicant.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DataEnvelopeScoreExplanation"
        "404":
          $ref: "#/components/responses/NotFound"
  /v1/compositions:
    post:
      operationId: composePremium
      tags: [Composition]
      security:
        - ApiKeyAuth: []
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PremiumCompositionCreate"
      responses:
        "201":
          description: >-
            Technical cost assembled from expected claims, loading for risk, and
            loading for expense, each traceable to its contributing models.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DataEnvelopePremiumComposition"
        "422":
          description: >-
            Rejected when a contributing model has not declared its premium term
            or when a risk-loading reduction cites touchpoint frequency without
            supporting touchpoint evidence.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Problem"
  /v1/compositions/{compositionId}/calibration:
    parameters:
      - $ref: "#/components/parameters/CompositionId"
    post:
      operationId: applyCommercialCalibration
      tags: [Composition]
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CommercialCalibrationCreate"
      responses:
        "200":
          description: >-
            Attributed step from technical cost to offered price, keeping pricing
            distinguishable from costing.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DataEnvelopeCommercialCalibration"
        "403":
          description: Calibration beyond the approver's threshold requires escalation
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Problem"
  /v1/compositions/{compositionId}/offer:
    parameters:
      - $ref: "#/components/parameters/CompositionId"
    post:
      operationId: issuePriceOffer
      tags: [Composition]
      security:
        - ApiKeyAuth: []
        - BearerAuth: []
      responses:
        "201":
          description: Offer issued within the permitted variation envelope
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DataEnvelopePriceOffer"
        "409":
          description: >-
            Offer refused by the permitted variation gate because the magnitude or
            frequency of variation exceeds what the jurisdiction permits for this
            product.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Problem"
  /v1/variation-envelopes:
    get:
      operationId: listVariationEnvelopes
      tags: [Composition]
      security:
        - BearerAuth: []
      parameters:
        - $ref: "#/components/parameters/Cursor"
        - $ref: "#/components/parameters/Limit"
        - name: jurisdiction
          in: query
          schema:
            type: string
            example: NL
        - name: productCode
          in: query
          schema:
            type: string
      responses:
        "200":
          description: Permitted magnitude and frequency of price variation
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ListEnvelopeVariationEnvelope"
    post:
      operationId: setVariationEnvelope
      tags: [Composition]
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/VariationEnvelopeCreate"
      responses:
        "201":
          description: Envelope recorded with its filing or rule basis
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DataEnvelopeVariationEnvelope"
  /v1/permitting/factor-permits:
    get:
      operationId: listFactorPermits
      tags: [Permitting]
      security:
        - BearerAuth: []
      parameters:
        - $ref: "#/components/parameters/Cursor"
        - $ref: "#/components/parameters/Limit"
        - name: jurisdiction
          in: query
          schema:
            type: string
        - name: position
          in: query
          schema:
            type: string
            enum: [permitted, permitted_with_conditions, prohibited, undetermined]
        - name: dataCategory
          in: query
          schema:
            $ref: "#/components/schemas/DataCategory"
      responses:
        "200":
          description: Per-factor, per-jurisdiction permitted-use positions
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ListEnvelopeFactorPermit"
    post:
      operationId: recordFactorPermit
      tags: [Permitting]
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/FactorPermitCreate"
      responses:
        "201":
          description: Position recorded by a named compliance officer
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DataEnvelopeFactorPermit"
        "422":
          $ref: "#/components/responses/UnprocessableEntity"
  /v1/permitting/models:
    get:
      operationId: listRiskModels
      tags: [Permitting]
      security:
        - BearerAuth: []
      parameters:
        - $ref: "#/components/parameters/Cursor"
        - $ref: "#/components/parameters/Limit"
        - name: premiumTerm
          in: query
          schema:
            $ref: "#/components/schemas/PremiumTerm"
        - name: state
          in: query
          schema:
            type: string
            enum: [candidate, awaiting_validation, validated, in_production, withdrawn]
      responses:
        "200":
          description: Models with declared premium term and validation state
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ListEnvelopeRiskModel"
    post:
      operationId: submitRiskModel
      tags: [Permitting]
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RiskModelCreate"
      responses:
        "201":
          description: Model queued for validation with its declared premium term
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DataEnvelopeRiskModel"
        "422":
          description: >-
            Rejected because no premium term was declared. A model that cannot
            name the term of the price it acts on may not be deployed.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Problem"
  /v1/permitting/models/{modelId}/validation:
    parameters:
      - $ref: "#/components/parameters/ModelId"
    post:
      operationId: validateRiskModel
      tags: [Permitting]
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ModelValidationCreate"
      responses:
        "200":
          description: Validation outcome and production permission by jurisdiction
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DataEnvelopeModelValidation"
  /v1/permitting/validation-queue:
    get:
      operationId: getValidationQueue
      tags: [Permitting]
      security:
        - BearerAuth: []
      responses:
        "200":
          description: >-
            Queue depth and ageing for candidate models, reported as operational
            risk since model production outpaces validation capacity.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DataEnvelopeValidationQueue"
  /v1/engagement/programmes:
    get:
      operationId: listEngagementProgrammes
      tags: [Engagement]
      security:
        - BearerAuth: []
      parameters:
        - $ref: "#/components/parameters/Cursor"
        - $ref: "#/components/parameters/Limit"
        - name: state
          in: query
          schema:
            type: string
            enum: [design, boundary_review, live, suspended, closed]
      responses:
        "200":
          description: Engagement programmes with boundary review outcomes
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ListEnvelopeEngagementProgramme"
    post:
      operationId: createEngagementProgramme
      tags: [Engagement]
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/EngagementProgrammeCreate"
      responses:
        "201":
          description: >-
            Programme created pending review against the medical-advice and
            inducement boundaries for each jurisdiction.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DataEnvelopeEngagementProgramme"
  /v1/engagement/touchpoints:
    post:
      operationId: recordTouchpointEvent
      tags: [Engagement]
      security:
        - ApiKeyAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/TouchpointEventCreate"
      responses:
        "201":
          description: Touchpoint recorded against the enrolment ledger
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DataEnvelopeTouchpointEvent"
  /v1/engagement/enrolments/{enrolmentId}/frequency:
    parameters:
      - $ref: "#/components/parameters/EnrolmentId"
    get:
      operationId: getTouchpointFrequency
      tags: [Engagement]
      security:
        - BearerAuth: []
      responses:
        "200":
          description: >-
            Measured touchpoint frequency against the frequency assumed when the
            risk loading was reduced.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DataEnvelopeTouchpointFrequency"
  /v1/experience/cohorts:
    get:
      operationId: listCohortDefinitions
      tags: [Experience]
      security:
        - BearerAuth: []
      parameters:
        - $ref: "#/components/parameters/Cursor"
        - $ref: "#/components/parameters/Limit"
        - name: programmeId
          in: query
          schema:
            type: string
      responses:
        "200":
          description: Engaged and matched unengaged cohort definitions
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ListEnvelopeCohortDefinition"
    post:
      operationId: defineCohort
      tags: [Experience]
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CohortDefinitionCreate"
      responses:
        "201":
          description: Cohort defined with its selection-effect separation method
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DataEnvelopeCohortDefinition"
        "422":
          description: >-
            Rejected when an engaged cohort has no comparable unengaged cohort or
            no stated method for separating self-selection from behaviour.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Problem"
  /v1/experience/observations:
    get:
      operationId: listExperienceObservations
      tags: [Experience]
      security:
        - BearerAuth: []
      parameters:
        - $ref: "#/components/parameters/Cursor"
        - $ref: "#/components/parameters/Limit"
        - name: cohortId
          in: query
          schema:
            type: string
        - name: period
          in: query
          schema:
            type: string
      responses:
        "200":
          description: >-
            Realised claims, lapse, and persistency for the cohort against the
            priced assumption.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ListEnvelopeExperienceObservation"
  /v1/experience/savings-credits:
    post:
      operationId: creditExpectedClaimsSaving
      tags: [Experience]
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SavingsCreditCreate"
      responses:
        "201":
          description: >-
            Expected-claims saving credited to the pricing basis after actuarial
            sign-off on observed cohort experience.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DataEnvelopeSavingsCredit"
        "409":
          description: >-
            Refused because the observation window is incomplete, the selection
            effect is unseparated, or persistency deteriorated materially.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Problem"
  /v1/claims/automatic-settlements:
    post:
      operationId: settleClaimAutomatically
      tags: [Claims]
      security:
        - ApiKeyAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AutomaticSettlementCreate"
      responses:
        "201":
          description: Claim settled within a cleared coverage and evidence pattern
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DataEnvelopeAutomaticSettlement"
        "409":
          description: >-
            Referred rather than settled because the coverage or evidence pattern
            is not cleared, or a coverage anomaly was detected.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Problem"
  /v1/claims/fraud-referrals:
    post:
      operationId: raiseFraudReferral
      tags: [Claims]
      security:
        - ApiKeyAuth: []
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/FraudReferralCreate"
      responses:
        "201":
          description: Referral raised with its evidence trail, not only a score
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DataEnvelopeFraudReferral"
  /v1/claims/expense-measurements:
    get:
      operationId: getExpenseMeasurement
      tags: [Claims]
      security:
        - BearerAuth: []
      parameters:
        - name: productCode
          in: query
          schema:
            type: string
        - name: period
          in: query
          schema:
            type: string
      responses:
        "200":
          description: >-
            Measured cost per policy issued and per claim settled, the evidence
            base for the loading for expense.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DataEnvelopeExpenseMeasurement"
  /v1/reinsurance/cession-experience:
    get:
      operationId: getCessionExperience
      tags: [Reinsurance]
      security:
        - ApiKeyAuth: []
        - BearerAuth: []
      parameters:
        - name: treatyId
          in: query
          required: true
          schema:
            type: string
        - name: cohortId
          in: query
          schema:
            type: string
        - name: period
          in: query
          schema:
            type: string
      responses:
        "200":
          description: Cohort experience against the treaty pricing basis
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DataEnvelopeCessionExperience"
  /v1/decisions/{decisionId}/review:
    parameters:
      - $ref: "#/components/parameters/DecisionId"
    post:
      operationId: requestHumanReview
      tags: [Scoring]
      security:
        - ApiKeyAuth: []
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [requestedBy, grounds]
              properties:
                requestedBy:
                  type: string
                  enum: [applicant, policyholder, claimant, distributor, underwriter]
                grounds:
                  type: string
      responses:
        "201":
          description: >-
            Human review opened on an automated declinature, exclusion, or claims
            decision, with the factor explanation attached.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DataEnvelopeReviewDecision"
components:
  securitySchemes:
    ApiKeyAuth:
      type: apiKey
      in: header
      name: X-API-Key
    BearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
  parameters:
    Cursor:
      name: cursor
      in: query
      schema:
        type: string
    Limit:
      name: limit
      in: query
      schema:
        type: integer
        minimum: 1
        maximum: 200
        default: 50
    RiskSubjectId:
      name: riskSubjectId
      in: path
      required: true
      schema:
        type: string
    ScoreId:
      name: scoreId
      in: path
      required: true
      schema:
        type: string
    CompositionId:
      name: compositionId
      in: path
      required: true
      schema:
        type: string
    ModelId:
      name: modelId
      in: path
      required: true
      schema:
        type: string
    EnrolmentId:
      name: enrolmentId
      in: path
      required: true
      schema:
        type: string
    DecisionId:
      name: decisionId
      in: path
      required: true
      schema:
        type: string
  responses:
    Unauthorized:
      description: Missing or invalid credentials
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Problem"
    NotFound:
      description: Resource not found
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Problem"
    UnprocessableEntity:
      description: Validation failed
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Problem"
  schemas:
    ResponseMeta:
      type: object
      required: [requestId, timestamp]
      properties:
        requestId:
          type: string
        timestamp:
          type: string
          format: date-time
    Problem:
      type: object
      required: [type, title, status]
      properties:
        type:
          type: string
          format: uri
        title:
          type: string
        status:
          type: integer
        detail:
          type: string
    Money:
      type: object
      required: [amount, currency]
      properties:
        amount:
          type: number
          format: double
        currency:
          type: string
          example: EUR
    PremiumTerm:
      type: string
      description: The term of the price a model or lever acts on
      enum: [expected_claims, loading_for_risk, loading_for_expense]
    DataCategory:
      type: string
      enum:
        - connected_life
        - connected_car
        - connected_home
        - connected_finance
        - medical_evidence
        - genetic
        - epigenetic
        - microbiome
        - geographic
        - declared_lifestyle
        - population_table
    ProcessingPurpose:
      type: string
      enum:
        - underwriting
        - pricing
        - renewal_pricing
        - engagement_service
        - claims_assessment
        - fraud_detection
        - experience_study
    ConsentRecord:
      type: object
      required: [id, riskSubjectId, dataCategory, state]
      properties:
        id:
          type: string
        riskSubjectId:
          type: string
        dataCategory:
          $ref: "#/components/schemas/DataCategory"
        purposes:
          type: array
          items:
            $ref: "#/components/schemas/ProcessingPurpose"
        state:
          type: string
          enum: [granted, withdrawn, expired]
        lawfulBasis:
          type: string
          enum: [explicit_consent, contract, legitimate_interest, vital_interest]
        grantedAt:
          type: string
          format: date-time
        withdrawnAt:
          type: string
          format: date-time
        fallbackApplied:
          type: string
          description: Pricing and servicing fallback invoked on withdrawal
    ConsentRecordCreate:
      type: object
      required: [dataCategory, state, purposes]
      properties:
        dataCategory:
          $ref: "#/components/schemas/DataCategory"
        purposes:
          type: array
          items:
            $ref: "#/components/schemas/ProcessingPurpose"
        state:
          type: string
          enum: [granted, withdrawn, expired]
        lawfulBasis:
          type: string
    ConsentState:
      type: object
      properties:
        riskSubjectId:
          type: string
        purpose:
          $ref: "#/components/schemas/ProcessingPurpose"
        permittedCategories:
          type: array
          items:
            $ref: "#/components/schemas/DataCategory"
        blockedCategories:
          type: array
          items:
            $ref: "#/components/schemas/DataCategory"
        coverageNote:
          type: string
        resolvedAt:
          type: string
          format: date-time
    Feature:
      type: object
      required: [name, dataCategory]
      properties:
        name:
          type: string
          example: mean_weekly_active_minutes
        dataCategory:
          $ref: "#/components/schemas/DataCategory"
        value:
          type: string
        observedFrom:
          type: string
          format: date
        observedTo:
          type: string
          format: date
        consentRecordId:
          type: string
    ScoreRequest:
      type: object
      required: [riskSubjectId, jurisdiction, productCode, purpose]
      properties:
        riskSubjectId:
          type: string
        applicationReference:
          type: string
        jurisdiction:
          type: string
        productCode:
          type: string
        purpose:
          $ref: "#/components/schemas/ProcessingPurpose"
        features:
          type: array
          items:
            $ref: "#/components/schemas/Feature"
    ScoreContribution:
      type: object
      required: [modelId, premiumTerm]
      properties:
        modelId:
          type: string
        modelVersion:
          type: string
        premiumTerm:
          $ref: "#/components/schemas/PremiumTerm"
        contributionValue:
          type: number
          format: double
        unit:
          type: string
          enum: [relative_multiplier, absolute_amount, rate_per_mille]
        confidence:
          type: number
          format: float
    ScoreResult:
      type: object
      required: [id, riskSubjectId, contributions]
      properties:
        id:
          type: string
        riskSubjectId:
          type: string
        jurisdiction:
          type: string
        productCode:
          type: string
        contributions:
          type: array
          items:
            $ref: "#/components/schemas/ScoreContribution"
        featuresUsed:
          type: array
          items:
            type: string
        featuresSuppressed:
          type: array
          description: Features withheld for permitting or consent reasons
          items:
            type: object
            properties:
              name:
                type: string
              reason:
                type: string
